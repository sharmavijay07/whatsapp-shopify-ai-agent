# Render free web service: one process, 512 MB, no Qdrant and no n8n.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: whatsapp-shopify-ai-agent
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn harbor.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: APP_MODE
        value: mock
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: VECTOR_STORE
        value: memory
      - key: EMBEDDING_PROVIDER
        value: bm25
      - key: SANDBOX_UI_DIR
        value: web/out
      - key: GROQ_API_KEY
        sync: false
